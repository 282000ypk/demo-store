{% extends "base.html" %}
{% block title %}Shop - PS5 Game Shop{% endblock %}

{% block content %}
<h1>PS5 Games</h1>
<div class="game-grid">
  {% for game in games %}
  <div class="game-card">
    <img src="{{ game.image }}" alt="{{ game.title }}">
    <div class="game-info">
      <h3>{{ game.title }}</h3>
      <p class="description">{{ game.description }}</p>
      <p class="price">₹{{ game.price }}</p>
      <form action="{{ url_for('add_to_cart', game_id=game.id) }}" method="POST">
        <button type="submit" class="btn btn-primary">Add to Cart</button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
